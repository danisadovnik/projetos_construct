<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CódigoKid Erechim · Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
    <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  
</head>
<body>
  <div class="landing">

    <!-- cabeçalho -->
    <div class="header">
      <div class="logo-area">
        <div class="logo-placeholder" title="Espaço para a logo da CódigoKid Erechim">
          <img src="logo.png" alt="Logo CódigoKid Erechim" style="width: 100%; height: 100%; object-fit: contain; padding: 8px;" />
        </div>
        <div class="school-name">
          CódigoKid Erechim
          <small>· GameStarter</small>
        </div>
      </div>
      <div class="tech-badge">
        <i>⚡</i> desenvolvido com <span style="font-weight:700; color:#b5f0e6;">Construct 3</span>
      </div>
    </div>

           <!-- CONTAINER DINÂMICO DE MÓDULOS (Construct, Scratch, etc.) -->
    <div id="modulosContainer">
      <!-- preenchido dinamicamente pelo JavaScript a partir do jogos.json -->
    </div>

    <!-- BLOCO EXPANSÍVEL: JOGOS DOS ALUNOS -->
    <details class="alunos-section" id="alunosSection">
      <summary class="alunos-summary">
        <span class="alunos-summary-icon">🎓</span>
        <span class="alunos-summary-text">Jogos desenvolvidos pelos alunos</span>
        <span class="alunos-summary-arrow">▼</span>
      </summary>
      <div class="alunos-content">
        <div class="projects-grid" id="jogosAlunosGrid">
          <!-- preenchido dinamicamente pelo JavaScript -->
        </div>
      </div>
    </details>

    <!-- rodapé -->
    <div class="footer-note">
      <span class="construct-badge">
        🛠️ Todos os jogos foram criados com a engine <strong onclick="window.open('https://www.construct.net/en', '_blank')" style="cursor: pointer;">Construct 3</strong>
      </span>
      <span class="school-tag">
        🧪 CódigoKid · Erechim
      </span>
      <span style="opacity:0.5; font-size:0.75rem; letter-spacing:0.3px;">
        clique no card para abrir
      </span>
    </div>

  </div>

  <!-- DIALOG -->
  <dialog id="gameDialog">
    <div class="dialog-header">
      <span class="game-title" id="dialogTitle">🎮 Jogo</span>
      <div class="actions">
        <button class="open-new-btn" id="openNewBtn" title="Abrir em nova janela">↗ Nova janela</button>
        <button class="close-btn" id="closeDialogBtn">✕ Fechar</button>
      </div>
    </div>
        <div class="dialog-body">
      <div class="game-instructions" id="dialogInstructions" hidden>
        <span class="instructions-icon">💡</span>
        <span class="instructions-text" id="dialogInstructionsText"></span>
      </div>
      <div class="iframe-wrapper">
        <div class="loading-overlay" id="dialogLoading">
          <div class="spinner"></div>
          <span>Carregando jogo...</span>
        </div>
        <iframe id="dialogFrame" src="" allowfullscreen allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope"></iframe>
      </div>
    </div>
  </dialog>

 <script>
  // Referências
  const dialog = document.getElementById('gameDialog');
  const dialogFrame = document.getElementById('dialogFrame');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogLoading = document.getElementById('dialogLoading');
  const closeDialogBtn = document.getElementById('closeDialogBtn');
  const openNewBtn = document.getElementById('openNewBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  const jogosModuloGrid = document.getElementById('jogosModuloGrid');
  const jogosAlunosGrid = document.getElementById('jogosAlunosGrid');

  let currentGameUrl = '';
  let currentGameName = '';

  // ============================================
  // CARREGAMENTO DOS JOGOS A PARTIR DO JSON
  // ============================================

    const modulosContainer = document.getElementById('modulosContainer');

  async function carregarJogos() {
    try {
      const resposta = await fetch('jogos.json');
      if (!resposta.ok) throw new Error('Não foi possível carregar o jogos.json');
      const dados = await resposta.json();

      renderizarModulos(dados.modulos || []);
      renderizarJogosAlunos(dados.jogosAlunos || []);
    } catch (erro) {
      console.error('❌ Erro ao carregar jogos:', erro);
      modulosContainer.innerHTML = '<p style="color:#8a93af; text-align:center;">Não foi possível carregar a lista de jogos.</p>';
    }
  }

  // Renderiza todos os módulos (Construct, Scratch, etc.)
  function renderizarModulos(modulos) {
    modulosContainer.innerHTML = '';
    modulos.forEach(modulo => {
      const secao = document.createElement('section');
      secao.className = 'modulo-section';
      secao.style.setProperty('--modulo-cor', modulo.cor || '#f5c76b');

      secao.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">
            <span class="section-icon">${modulo.icone || '🎯'}</span>
            ${modulo.titulo}
          </h2>
          <span class="section-subtitle">${modulo.subtitulo || ''}</span>
        </div>
        <div class="projects-grid"></div>
      `;

      const grid = secao.querySelector('.projects-grid');
      (modulo.jogos || []).forEach(jogo => {
        const card = document.createElement('a');
        card.href = '#';
        card.className = `project-card card-${jogo.id}`;
        card.style.textDecoration = 'none';
        card.dataset.game = jogo.embedUrl;
        card.dataset.name = jogo.nome;
        card.innerHTML = `
          <div class="project-icon">${jogo.icone || '🎮'}</div>
          <div class="project-name">${jogo.nome}</div>
          <div class="project-sub">${modulo.id === 'scratch' ? 'Scratch' : 'Construct 3'}</div>
          <div class="cta-play">▶ selecionar</div>
        `;
               card.addEventListener('click', e => {
          e.preventDefault();
          abrirJogoDialog(jogo.embedUrl, jogo.nome, jogo.instrucoes);
        });
        grid.appendChild(card);
      });

      modulosContainer.appendChild(secao);
    });
  }

  // Renderiza os cards dos jogos dos alunos
  function renderizarJogosAlunos(jogos) {
    jogosAlunosGrid.innerHTML = '';
    if (jogos.length === 0) {
      jogosAlunosGrid.innerHTML = '<p style="color:#8a93af; grid-column: 1/-1; text-align:center;">Nenhum jogo de aluno cadastrado ainda.</p>';
      return;
    }
    jogos.forEach(jogo => {
      const card = document.createElement('a');
      card.href = '#';
      card.className = `project-card card-aluno`;
      card.style.textDecoration = 'none';
      card.dataset.game = jogo.embedUrl;
      card.dataset.name = jogo.nome;
      card.innerHTML = `
        <div class="project-icon">${jogo.icone || '🎮'}</div>
        <div class="project-name">${jogo.nome}</div>
        <div class="project-desc">${jogo.descricao || ''}</div>
        <div class="project-author">👤 ${jogo.aluno || 'Aluno'}</div>
        <div class="cta-play">▶ jogar</div>
      `;
      card.addEventListener('click', e => {
        e.preventDefault();
        abrirJogoDialog(jogo.embedUrl, jogo.nome);
      });
      jogosAlunosGrid.appendChild(card);
    });
  }

  // ============================================
  // DIALOG (abrir/fechar/fullscreen)
  // ============================================

  const dialogInstructions = document.getElementById('dialogInstructions');
  const dialogInstructionsText = document.getElementById('dialogInstructionsText');

  function abrirJogoDialog(url, nome, instrucoes) {
    currentGameUrl = url;
    currentGameName = nome;
    dialogTitle.textContent = '🎮 ' + nome;

    // Instruções (opcional)
    if (instrucoes && instrucoes.trim() !== '') {
      dialogInstructionsText.textContent = instrucoes;
      dialogInstructions.hidden = false;
    } else {
      dialogInstructionsText.textContent = '';
      dialogInstructions.hidden = true;
    }

    dialogLoading.style.display = 'flex';
    dialogFrame.src = url;
    dialogFrame.onload = function () {
      dialogLoading.style.display = 'none';
    };
    dialog.showModal();
  }

  function fecharDialog() {
    dialog.close();
    dialogFrame.src = '';
    dialogLoading.style.display = 'flex';
  }

  function abrirNovaJanela() {
    if (currentGameUrl) window.open(currentGameUrl, '_blank');
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      dialog.requestFullscreen().catch(err => console.error('Erro fullscreen:', err));
    } else {
      document.exitFullscreen();
    }
  }

  // ============================================
  // EVENTOS
  // ============================================
  closeDialogBtn.addEventListener('click', fecharDialog);
  openNewBtn.addEventListener('click', abrirNovaJanela);
  //fullscreenBtn.addEventListener('click', toggleFullscreen);
  dialog.addEventListener('cancel', fecharDialog);

  document.addEventListener('fullscreenchange', () => {
    if (fullscreenBtn) {
      fullscreenBtn.textContent = document.fullscreenElement ? '⛶ Sair' : '⛶ Tela cheia';
    }
  });

  // ============================================
  // BLOQUEIO DE SCROLL QUANDO DIALOG ESTIVER ABERTO
  // ============================================
  document.addEventListener('keydown', function (e) {
    if (dialog.open) {
      const teclasScroll = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'PageUp', 'PageDown', 'Home', 'End'];
      if (teclasScroll.includes(e.code)) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }
  }, { passive: false, capture: true });

  document.addEventListener('wheel', function (e) {
    if (dialog.open && e.target.closest('iframe')) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, { passive: false, capture: true });

  document.addEventListener('touchmove', function (e) {
    if (dialog.open && e.target.closest('iframe')) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, { passive: false, capture: true });

  // ============================================
  // INICIALIZA
  // ============================================
  carregarJogos();

  console.log('🎮 Sistema de jogos carregado!');
</script>

</body>
</html>
